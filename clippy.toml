# ffmpeg-next reads a picture's colors as Rust enums with gaps in them, but
# a file can put any number there, and one no variant has is undefined
# behavior. Read them as numbers, as src/media/colors.rs does.
disallowed-methods = [
    { path = "ffmpeg_next::util::frame::video::Video::color_range", reason = "a file can hold a number the enum has no variant for: use media::colors" },
    { path = "ffmpeg_next::util::frame::video::Video::color_space", reason = "a file can hold a number the enum has no variant for: use media::colors" },
    { path = "ffmpeg_next::util::frame::video::Video::color_primaries", reason = "a file can hold a number the enum has no variant for: use media::colors" },
    { path = "ffmpeg_next::util::frame::video::Video::color_transfer_characteristic", reason = "a file can hold a number the enum has no variant for: use media::colors" },
    { path = "ffmpeg_next::codec::decoder::video::Video::color_range", reason = "a file can hold a number the enum has no variant for: use media::colors" },
    { path = "ffmpeg_next::codec::decoder::video::Video::color_space", reason = "a file can hold a number the enum has no variant for: use media::colors" },
    { path = "ffmpeg_next::codec::decoder::video::Video::color_primaries", reason = "a file can hold a number the enum has no variant for: use media::colors" },
    { path = "ffmpeg_next::codec::decoder::video::Video::color_transfer_characteristic", reason = "a file can hold a number the enum has no variant for: use media::colors" },
]
