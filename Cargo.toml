[package]
name = "plays"
version = "0.1.0"
edition = "2024"
description = "A small multi-media player built on gpui that can play many videos and audio files at once"
license = "MIT"
publish = false

[[bin]]
name = "plays"
path = "src/main.rs"

# Plays and the crates beside it (`crates/`). Commands run here act on
# Plays alone; `--workspace` takes in the crates too.
[workspace]
members = [".", "crates/*"]

# Lints for Plays and every crate, each of which takes them with
# `[lints] workspace = true`. A function over 100 lines is split into
# helpers named for what each part does.
[workspace.lints.clippy]
too_many_lines = "warn"

[lints]
workspace = true

[dependencies]
anyhow = "1"
# The command line's subcommands, options and help (`src/cli`), and the
# scripts that complete them in bash, zsh, fish and Nushell (`completions`).
clap = { version = "4", features = ["derive", "string"] }
completions = { path = "crates/completions" }
cpal = "0.18"
dirs = "6"
env_logger = "0.11"
futures = "0.3"
ffmpeg-next = { version = "9.1", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
# Sound reads of what ffmpeg-next reads unsoundly.
ffmpeg-safe = { path = "crates/ffmpeg-safe" }
gpui = "0.2.2"
# JPEG for screenshots; PNG goes straight through `png`, which can tag HDR.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
# The Lua scripts `plays do` runs: Lua 5.4, built in, its values to and
# from JSON.
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
parking_lot = "0.12"
png = "0.18"
# The threads converting pictures on the CPU share out each frame's rows;
# the version gpui already builds.
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stream-server = { path = "crates/stream-server" }
unicode-segmentation = "1"
url = "2"
chardetng = "0.1"
encoding_rs = "0.8"
dlna = { path = "crates/dlna" }
chromecast = { path = "crates/chromecast" }
airplay = { path = "crates/airplay" }

# The same CoreFoundation and CoreVideo bindings gpui uses, to hand it
# hardware-decoded frames to draw (`gpui::surface`).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-video = "0.4"
# To fade the traffic lights, which gpui has no way to hide.
objc = "0.2"
raw-window-handle = "0.6"

# The desktop portal's Inhibit, to keep the screen awake while a video
# plays; the same version and features gpui uses.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
# The mouse, and black windows over the other monitors, for Black out other
# displays; the version gpui uses.
x11rb = "0.13"

[features]
# Scripted runs of the real app, for what headless tests can't reach:
# `script/smoke` (see CONTRIBUTING.md). Its settings are the defaults,
# never saved.
smoke = []

[build-dependencies]
ffmpeg-link = { path = "crates/ffmpeg-link" }

# gpui's test platform, for `#[gpui::test]`s: headless windows, simulated
# input and a deterministic executor. Only in test builds.
[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
# Their fake devices, for casting to them headless.
dlna = { path = "crates/dlna", features = ["fake"] }
chromecast = { path = "crates/chromecast", features = ["fake"] }
airplay = { path = "crates/airplay", features = ["fake"] }
# What the AirPlay fake was told, which comes as property lists.
plist = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
# Reads gpui's shaders for Linux, which nothing building on macOS does.
naga = { version = "25.0", features = ["wgsl-in"] }

[profile.dev]
# Video decoding and pixel conversion are painfully slow without optimizations.
opt-level = 1
# Debug info in a .dSYM on macOS, not left in object files, which pile up in
# target/debug with each incremental build.
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# Smoke runs' builds, with the `smoke` feature: `target/smoke/plays`, apart
# from the release one, whose settings are the real ones.
[profile.smoke]
inherits = "release"

# gpui with HDR video on macOS, and the xattr it reaches building on Linux
# with today's libc; see PLAYS.md in each for what changed.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
xattr = { path = "vendor/xattr" }
