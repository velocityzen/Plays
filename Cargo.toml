[package]
name = "plays"
version = "0.1.0"
edition = "2024"
description = "A small multi-media player built on gpui that can play many videos and audio files at once"
license = "MIT"
publish = false

[[bin]]
name = "plays"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cpal = "0.18"
dirs = "6"
env_logger = "0.11"
ffmpeg-next = { version = "9.1", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
gpui = "0.2.2"
image = { version = "0.25", default-features = false }
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# Video decoding and pixel conversion are painfully slow without optimizations.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
