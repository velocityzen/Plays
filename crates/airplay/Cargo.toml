[package]
name = "airplay"
version = "0.1.0"
edition = "2024"
description = "Finds, pairs with and controls AirPlay receivers: has a TV play a URL, and sends live sound to speakers"
license = "MIT"
publish = false

[lints]
workspace = true

[features]
# A pretend receiver on this computer, for tests here and in what uses the
# crate.
fake = []

[dependencies]
aes = "0.8"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-channel = "0.3.34"
hkdf = "0.12"
# This computer's own addresses, where its own AirPlay Receiver is found.
if-addrs = "0.15"
log = "0.4"
network = { path = "../network", features = ["mdns"] }
num-bigint = "0.4"
plist = "1"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
# Comparing pairing proofs in constant time.
subtle = "2.6.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
# The property and fuzz tests; `HEGEL_DEFAULT_PROFILE=fuzz` runs the
# fuzz tests, of what a device might send, long.
hegeltest = "0.54"
