[package]
name = "ffmpeg-safe"
version = "0.1.0"
edition = "2024"
description = "What ffmpeg-next reads unsoundly from FFmpeg, read soundly"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
# The same FFmpeg bindings Plays uses, linked to the same static FFmpeg.
ffmpeg-next = { version = "9.1", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
# A tag that isn't UTF-8 read in the encoding it looks like.
chardetng = "0.1"
encoding_rs = "0.8"

[build-dependencies]
ffmpeg-link = { path = "../ffmpeg-link" }
