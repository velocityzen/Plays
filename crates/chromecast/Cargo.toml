[package]
name = "chromecast"
version = "0.1.0"
edition = "2024"
description = "Finds and controls Google Cast devices: has a Chromecast, Google TV or Nest speaker play a URL, and drives it while it does"
license = "MIT"
publish = false

[features]
# A pretend Cast device on this computer, for tests here and in what uses
# the crate.
fake = ["dep:rcgen"]

[dependencies]
futures-channel = "0.3.34"
log = "0.4"
network = { path = "../network", features = ["mdns"] }
prost = "0.14"
rcgen = { version = "0.14", optional = true, default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde_json = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
