[package]
name = "stream-server"
version = "0.1.0"
edition = "2024"
description = "Serves media on the network in a form a TV or speaker plays: as is, repackaged or re-encoded, as HLS or an MPEG-TS stream"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
# The same FFmpeg bindings Plays uses, linked to the same static FFmpeg.
ffmpeg-next = { version = "9.1", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
ffmpeg-safe = { path = "../ffmpeg-safe" }
# HDR's light, fitted to SDR, and Dolby Vision's reshaping, as Plays has them.
hdr = { path = "../hdr" }
log = "0.4"
# Frames turned row by row in parallel.
rayon = "1.12"
# Connections taken that close for the device however they're let go of.
network = { path = "../network" }
# A listener over IPv4 and IPv6 both.
socket2 = "0.6"

[build-dependencies]
ffmpeg-link = { path = "../ffmpeg-link" }

[dev-dependencies]
# Profile 5's RPU and HDR10's metadata on frames.
hdr = { path = "../hdr", features = ["testing"] }
# The property tests.
hegeltest = "0.54"
